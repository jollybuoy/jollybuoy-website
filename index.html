    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "JollyBuoy Technology Services Inc.",
        "alternateName": "JollyBuoy Tech",
        "url": "https://jollybuoy.com",
        "logo": "https://jollybuoy.com/logo.png",
        "email": "info@jollybuoy.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "32 Forest Manor Road",
          "addressLocality": "North York",
          "addressRegion": "ON",
          "postalCode": "M2J 0H2",
          "addressCountry": "CA"
        },

  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>

      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="position" />
      <input type="url" name="linkedin" />
      <input type="url" name="portfolio" />
      <input type="file" name="resume" />
      <textarea name="coverLetter"></textarea>
      <input type="text" name="subject" />
      <input type="text" name="recipient" />
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
